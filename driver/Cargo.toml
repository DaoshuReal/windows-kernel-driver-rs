[package]
name = "driver"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wdk-sys = "0.2"
wdk-alloc = "0.2"
wdk-panic = "0.2"

[build-dependencies]
wdk-build = "0.2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true

[package.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33
